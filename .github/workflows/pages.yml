name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Run engine tests
        run: node engine.test.cjs

      - name: Build site with versioned assets
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html style.css engine.js sprites.js render.js input.js main.js _site/
          touch _site/.nojekyll
          VERSION="${GITHUB_SHA::8}"
          node tools/stamp-version.mjs _site/index.html "$VERSION"
          echo "Deployed version: $VERSION"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
